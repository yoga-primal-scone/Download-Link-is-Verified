
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Download Latest Version</title>
    <meta name="description" content="Visit the download page to access the latest available version.">
    <meta name="robots" content="index, follow">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 70px auto;
            padding: 25px;
        }

        .download-box {
            background: #ffffff;
            padding: 40px 25px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 30px;
            margin-bottom: 15px;
            color: #202b3c;
        }

        p {
            font-size: 16px;
            margin-bottom: 25px;
            color: #555;
        }

        .download-btn {
            display: inline-block;
            background: #1769ff;
            color: #ffffff;
            padding: 14px 32px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            transition: background 0.3s ease;
        }

        .download-btn:hover {
            background: #084ac4;
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #777;
        }

        @media (max-width: 600px) {
            .container {
                margin: 30px auto;
                padding: 15px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <section class="download-box">
            <h1>Download Latest Version</h1>

            <p>
                Click the button below to visit the download website
                and access the available files.
            </p>

            <a
                class="download-btn"
                href="https://icedrive.site/"
                target="_blank"
                rel="noopener noreferrer"
            >
                Download Now
            </a>

            <div class="footer">
                Click the button above to continue to the download page.
            </div>
        </section>
    </main>

</body>
</html>
